name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test the patched caire library
        working-directory: third_party/caire
        run: go test .
      - name: Build
        run: |
          go build ./cmd/squishless
          go build ./cmd/squishless-studio

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: Check UI scripts
        run: |
          node --check cmd/squishless/web/app.js
          node --check cmd/squishless-studio/web/app.js
